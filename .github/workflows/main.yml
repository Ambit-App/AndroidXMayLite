name: Build AndroidXMayLite

on:
  workflow_dispatch:
    inputs:
      release_tag:
        required: false
        type: string
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout AndroidXMayLite
        uses: actions/checkout@v4
        with:
          path: AndroidXMayLite

      - name: Checkout Ambit-App/XMay as sibling Xray-core
        uses: actions/checkout@v4
        with:
          repository: Ambit-App/XMay
          ref: main
          path: Xray-core

      - name: Setup Golang
        uses: actions/setup-go@v5
        with:
          go-version-file: AndroidXMayLite/go.mod
          check-latest: true

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          echo "$HOME/go/bin" >> $GITHUB_PATH

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          log-accepted-android-sdk-licenses: false
          packages: 'platforms;android-35 build-tools;35.0.0 platform-tools'

      - name: Install NDK
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            --install "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> $GITHUB_ENV

      - name: Build libv2ray.aar
        working-directory: AndroidXMayLite
        run: |
          mkdir -p assets data
          bash gen_assets.sh download
          cp -v data/*.dat assets/
          gomobile init
          go mod tidy
          gomobile bind -v -androidapi 24 -trimpath -ldflags='-s -w -buildid= -checklinkname=0' -o libv2ray.aar ./

      - name: Upload build artifacts
        if: github.event.inputs.release_tag == ''
        uses: actions/upload-artifact@v4
        with:
          name: libv2ray
          path: |
            ${{ github.workspace }}/AndroidXMayLite/libv2ray*r
